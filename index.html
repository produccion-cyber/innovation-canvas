<!DOCTYPE html>

<head>
  <!--
    ================================================================================
    INNOVATION CANVAS - Gestión Tecnológica (Clase 6: Creatividad e Innovación)
    ================================================================================
    Descripción:
      Aplicativo web interactivo (HTML, CSS y Vanilla JS) diseñado para transformar
      problemas organizacionales reales en oportunidades de innovación tecnológica.
      
    Flujo Pedagógico:
      1. Contexto y Problema (del síntoma al problema real sin partir de la tecnología)
      2. Técnica Creativa Guiada (SCAMPER, Seis Sombreros, Walt Disney, Brainstorming)
      3. Banco de Ideas y Matriz de Priorización (Criterios de Gestión Tecnológica)
      4. Definición de la Oportunidad (Piloto, Riesgos y Métricas Antes/Después)
      5. Ficha Ejecutiva Final (Finalización, PDF descargable, Markdown e Impresión)

    Decisiones Técnicas:
      - Arquitectura cliente autónoma en un único archivo index.html.
      - Almacenamiento local seguro en localStorage con esquema versionado.
      - Cero dependencias npm en runtime; Tailwind CDN y html2pdf.js para exportación directa.
      - Cero uso de prompt() o alert() (incompatibles con iframes); modales accesibles propios.
    ================================================================================
  -->

<body class="h-full bg-slate-50 text-slate-800 dark:bg-navy-950 dark:text-slate-100 flex flex-col antialiased transition-colors duration-200">

  <script>
    (function () {
      'use strict';

      /* ==========================================================================
         SECCIÓN 1: UTILIDADES (Seguridad, Fechas, Debounce, Toasts)
         ========================================================================== */
      const STORAGE_KEY = 'INNOVATION_CANVAS_V2';
      const SCHEMA_VERSION = 2;

      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function uuid() {
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 9);
      }

      function formatDate(isoStr) {
        if (!isoStr) return 'Sin fecha';
        try {
          const d = new Date(isoStr);
          return d.toLocaleDateString('es-CO', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        } catch (e) {
          return isoStr;
        }
      }

      function debounce(fn, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      function showToast(message, type = 'info', duration = 3500) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto transform transition-all duration-300 ease-out translate-y-2 opacity-0 px-4 py-3 rounded-lg shadow-lg text-sm flex items-start gap-3 border ';
        
        let iconSvg = '';
        if (type === 'success') {
          toast.className += 'bg-emerald-900/95 text-emerald-100 border-emerald-700';
          iconSvg = '<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        } else if (type === 'error') {
          toast.className += 'bg-rose-900/95 text-rose-100 border-rose-700';
          iconSvg = '<svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        } else if (type === 'warning') {
          toast.className += 'bg-amber-900/95 text-amber-100 border-amber-700';
          iconSvg = '<svg class="w-5 h-5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
        } else {
          toast.className += 'bg-navy-900/95 text-slate-100 border-navy-700';
          iconSvg = '<svg class="w-5 h-5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        }

        toast.innerHTML = `
          ${iconSvg}
          <div class="flex-1 font-medium">${esc(message)}</div>
          <button class="text-slate-400 hover:text-white" onclick="this.parentElement.remove()" aria-label="Cerrar">&times;</button>
        `;

        container.appendChild(toast);
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, duration);
      }

      /* ==========================================================================
         SECCIÓN 2: CRIPTOGRAFÍA Y AUTENTICACIÓN LOCAL
         ========================================================================== */
      function hasCryptoSubtle() {
        return !!(window.crypto && window.crypto.subtle);
      }

      function bufferToHex(buffer) {
        return Array.from(new Uint8Array(buffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      }

      function generateSalt(length = 16) {
        const salt = new Uint8Array(length);
        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(salt);
        } else {
          for (let i = 0; i < length; i++) salt[i] = Math.floor(Math.random() * 256);
        }
        return bufferToHex(salt);
      }

      async function hashPassword(password, saltHex) {
        if (!hasCryptoSubtle()) {
          let hash = 0;
          const combined = password + ':' + saltHex;
          for (let i = 0; i < combined.length; i++) {
            const char = combined.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
          }
          return 'legacy_insecure_' + Math.abs(hash).toString(16);
        }

        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw',
          enc.encode(password),
          { name: 'PBKDF2' },
          false,
          ['deriveBits']
        );

        const saltBytes = new Uint8Array(saltHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const derivedBits = await window.crypto.subtle.deriveBits(
          {
            name: 'PBKDF2',
            salt: saltBytes,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          256
        );

        return bufferToHex(derivedBits);
      }

      function evaluatePasswordStrength(pwd) {
        const length = pwd ? pwd.length : 0;
        const hasLetter = /[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(pwd || '');
        const hasNumber = /[0-9]/.test(pwd || '');

        let level = 'Débil';
        let percent = 25;
        let colorClass = 'bg-rose-500';
        let textClass = 'text-rose-500';

        if (length < 8) {
          level = 'Débil (menos de 8 caracteres)';
          percent = Math.max(15, (length / 8) * 30);
          colorClass = 'bg-rose-500';
          textClass = 'text-rose-500 dark:text-rose-400';
        } else if (length >= 12 && hasLetter && hasNumber) {
          level = 'Fuerte';
          percent = 100;
          colorClass = 'bg-emerald-500';
          textClass = 'text-emerald-600 dark:text-emerald-400';
        } else if (length >= 10 && hasLetter && hasNumber) {
          level = 'Buena';
          percent = 75;
          colorClass = 'bg-sky-500';
          textClass = 'text-sky-600 dark:text-sky-400';
        } else {
          level = 'Aceptable (cumple el mínimo de 8)';
          percent = 50;
          colorClass = 'bg-amber-500';
          textClass = 'text-amber-600 dark:text-amber-400';
        }

        return {
          length,
          meetsRequirement: length >= 8,
          level,
          percent,
          colorClass,
          textClass
        };
      }

      /* ==========================================================================
         SECCIÓN 3: ALMACENAMIENTO Y ESQUEMA VERSIONADO
         ========================================================================== */
      function getInitialStorage() {
        return {
          schemaVersion: SCHEMA_VERSION,
          users: [],
          session: { userId: null },
          projects: []
        };
      }

      function loadStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('INNOVATION_CANVAS_V1');
          if (!raw) return getInitialStorage();
          const parsed = JSON.parse(raw);
          parsed.schemaVersion = SCHEMA_VERSION;
          parsed.projects = parsed.projects || [];
          parsed.users = parsed.users || [];
          parsed.session = parsed.session || { userId: null };
          
          // Normalización y migración defensiva de cada proyecto
          parsed.projects.forEach(p => {
            p.rt = p.rt || {};
            p.rt.scamper = p.rt.scamper || {};
            p.rt.six_hats = p.rt.six_hats || {};
            p.rt.walt_disney = p.rt.walt_disney || {};
            p.rt.brainstorming = p.rt.brainstorming || {};
            p.ideas = p.ideas || [];
            p.pesos = p.pesos || { impacto: 25, factibilidad: 20, madurez: 15, costo: 20, capacidades: 20 };
            p.brainstormingTimer = Number.isFinite(p.brainstormingTimer) ? p.brainstormingTimer : 240;
            if (!p.estado) {
              p.estado = (p.oportunidadId && p.problema && p.justificacionOportunidad) ? 'finalizado' : 'en_progreso';
            }
          });

          return parsed;
        } catch (err) {
          console.error('Error al leer de localStorage:', err);
          showToast('Error al leer datos locales.', 'error');
          return getInitialStorage();
        }
      }

      function saveStorage(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          indicateSavedStatus(true);
          return true;
        } catch (err) {
          console.error('Error al escribir en localStorage:', err);
          showToast('No se pudo guardar la información localmente.', 'error');
          indicateSavedStatus(false);
          return false;
        }
      }

      function indicateSavedStatus(success) {
        const statusEl = document.getElementById('save-status-indicator');
        if (!statusEl) return;
        if (success) {
          statusEl.innerHTML = '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-600 dark:text-emerald-400"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Guardado ✓</span>';
        } else {
          statusEl.innerHTML = '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-rose-600 dark:text-rose-400"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Error al guardar</span>';
        }
      }

      function indicateSavingStatus() {
        const statusEl = document.getElementById('save-status-indicator');
        if (!statusEl) return;
        statusEl.innerHTML = '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-amber-600 dark:text-amber-400"><span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Guardando…</span>';

      /* ==========================================================================
         SECCIÓN 6: ESTADO GLOBAL DE LA APLICACIÓN
         ========================================================================== */
      const App = {
        state: {
          currentUser: null,
          currentProjectId: null,
          currentTab: 'problema',
          activeTechnique: 'scamper',
          activeStepIndex: 0,
          theme: 'light',
          brainstormingInterval: null,
          brainstormingRunning: false,
          authMode: 'login',
          showPedagogicalExample: true // Permite colapsar el ejemplo del docente
        },

        init() {
          const savedTheme = localStorage.getItem('innovation_canvas_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            this.setTheme('dark', false);
          } else {
            this.setTheme('light', false);
          }

          const data = loadStorage();
          if (data.session && data.session.userId) {
            const user = data.users.find(u => u.id === data.session.userId);
            if (user) {
              this.state.currentUser = user;
              const userProjects = data.projects.filter(p => p.userId === user.id);
              if (userProjects.length > 0) {
                userProjects.sort((a, b) => new Date(b.actualizado) - new Date(a.actualizado));
                this.state.currentProjectId = userProjects[0].id;
                this.state.activeTechnique = userProjects[0].tecnica || 'scamper';
              }
            }
          }

          this.render();
        },

        setTheme(theme, save = true) {
          this.state.theme = theme;
          const html = document.documentElement;
          if (theme === 'dark') {
            html.classList.add('dark');
          } else {
            html.classList.remove('dark');
          }
          if (save) {
            localStorage.setItem('innovation_canvas_theme', theme);
          }
        },

        toggleTheme() {
          const next = this.state.theme === 'dark' ? 'light' : 'dark';
          this.setTheme(next, true);
          this.renderHeaderOnly();
        },

        switchTab(tabId) {
          if (!tabId) return;
          this.state.currentTab = tabId;
          this.state.activeTab = tabId;
          this.render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        getCurrentProject() {
          if (!this.state.currentProjectId) return null;
          const data = loadStorage();
          return data.projects.find(p => p.id === this.state.currentProjectId) || null;
        },

        updateCurrentProject(mutatorFn, shouldRerender = false) {
          if (!this.state.currentProjectId) return;
          indicateSavingStatus();
          const data = loadStorage();
          const idx = data.projects.findIndex(p => p.id === this.state.currentProjectId);
          if (idx !== -1) {
            mutatorFn(data.projects[idx]);
            data.projects[idx].actualizado = new Date().toISOString();
            saveStorage(data);
            if (shouldRerender) {
              this.render();
            }
          }
        },

        debouncedStepSave: debounce((techId, stepId, val) => {
          App.updateCurrentProject(p => {
            p.rt = p.rt || {};
            p.rt[techId] = p.rt[techId] || {};
            p.rt[techId][stepId] = val;
          }, false);
        }, 300),

        getProjectCompletionStatus(project) {
          if (!project) return { isComplete: false, missingItems: [], allMissing: [], completedCount: 0, totalRequirements: 13, diagMissing: [], techMissing: [], ideasMissing: [], oppMissing: [] };

          const diagMissing = [];
          if (!project.sintoma || !project.sintoma.trim()) diagMissing.push({ field: 'sintoma', label: 'Síntoma observado', tab: 'problema' });
          if (!project.causaCritica || !project.causaCritica.trim()) diagMissing.push({ field: 'causaCritica', label: 'Causa más crítica', tab: 'problema' });
          if (!project.justificacion || !project.justificacion.trim()) diagMissing.push({ field: 'justificacion', label: 'Justificación de la causa crítica', tab: 'problema' });
          if (!project.problema || !project.problema.trim()) diagMissing.push({ field: 'problema', label: 'Problema reformulado', tab: 'problema' });
          if (!project.pregunta || !project.pregunta.trim()) diagMissing.push({ field: 'pregunta', label: 'Pregunta de oportunidad ("¿Cómo podríamos...?")', tab: 'problema' });
          if (!project.evidencia || !project.evidencia.trim()) diagMissing.push({ field: 'evidencia', label: 'Evidencia o indicador (Dato → Brecha → Implicación)', tab: 'problema' });

          const techId = project.tecnica || 'scamper';
          const techAnswers = (project.rt && project.rt[techId]) ? project.rt[techId] : {};
          const answeredSteps = Object.values(techAnswers).filter(v => v && v.trim().length > 0).length;
          const techMissing = [];
          if (answeredSteps === 0) {
            const techName = (TECHNIQUES_CONFIG[techId] || {}).name || 'Creativa';
            techMissing.push({ field: 'tecnica', label: `Al menos un paso explorado en la técnica activa (${techName})`, tab: 'tecnica' });
          }

          const ideasCount = (project.ideas || []).length;
          const ideasMissing = [];
          if (ideasCount === 0) {
            ideasMissing.push({ field: 'ideas', label: 'Al menos una idea evaluada en la Matriz de Priorización', tab: 'ideas' });
          }

          const oppMissing = [];
          const validIdeaSelected = (project.ideas || []).some(i => i.id === project.oportunidadId);
          if (!project.oportunidadId || !validIdeaSelected) {
            oppMissing.push({ field: 'oportunidadId', label: 'Seleccionar la Oportunidad Ganadora del ranking', tab: 'oportunidad' });
          }
          if (!project.justificacionOportunidad || !project.justificacionOportunidad.trim()) {
            oppMissing.push({ field: 'justificacionOportunidad', label: 'Justificación estratégica de la selección', tab: 'oportunidad' });
          }
          if (!project.riesgos || !project.riesgos.trim()) {
            oppMissing.push({ field: 'riesgos', label: 'Riesgos y supuestos críticos', tab: 'oportunidad' });
          }
          if (!project.pasos || !project.pasos.trim()) {
            oppMissing.push({ field: 'pasos', label: 'Primeros pasos / Experimento piloto', tab: 'oportunidad' });
          }
          if (!project.indicadores || !project.indicadores.trim()) {
            oppMissing.push({ field: 'indicadores', label: 'Indicadores de éxito (Antes vs. Después)', tab: 'oportunidad' });
          }

          const allMissing = [...diagMissing, ...techMissing, ...ideasMissing, ...oppMissing];
          const totalRequirements = 13;
          const completedCount = totalRequirements - allMissing.length;

          return {
            isComplete: allMissing.length === 0,
            hasDiag: diagMissing.length === 0,
            hasTech: techMissing.length === 0,
            hasIdeas: ideasMissing.length === 0,
            hasOpp: oppMissing.length === 0,
            diagMissing,
            techMissing,
            ideasMissing,
            oppMissing,
            allMissing,
            totalRequirements,
            completedCount
          };
        }
      };

      App.calculateIdeaScore = function (idea, pesos) {
        if (!idea.p) return 0;
        const p = idea.p;
        const wImpacto = pesos.impacto || 25;
        const wFact = pesos.factibilidad || 20;
        const wMadurez = pesos.madurez || 15;
        const wCosto = pesos.costo || 20;
        const wCap = pesos.capacidades || 20;

        const totalWeight = wImpacto + wFact + wMadurez + wCosto + wCap;
        if (totalWeight === 0) return 0;

        // Inversión: escala 1 a 5 -> menor costo = mayor beneficio = 6 - costo
        const costoFavorable = 6 - (p.costo || 3);

        const score = (
          (p.impacto || 3) * wImpacto +
          (p.factibilidad || 3) * wFact +
          (p.madurez || 3) * wMadurez +
          costoFavorable * wCosto +
          (p.capacidades || 3) * wCap
        ) / totalWeight;

        return Number(score.toFixed(2));
      };

      /* ==========================================================================

      App.renderTabOportunidad = function (project) {

        // Auto-seleccionar la mejor alternativa si no hay oportunidadId guardada pero existen ideas
        if (!project.oportunidadId && ranked.length > 0) {
          project.oportunidadId = ranked[0].id;
          App.updateCurrentProject(p => { p.oportunidadId = ranked[0].id; }, false);
        }

        const selectedId = project.oportunidadId || (ranked.length > 0 ? ranked[0].id : null);
        const selectedIdea = ideas.find(i => i.id === selectedId) || null;

        // Auditoría precisa del Paso 4 (Oportunidad)
        const cIdea = !!(project.oportunidadId && selectedIdea);
        const cJust = !!(project.justificacionOportunidad && project.justificacionOportunidad.trim());
        const cRiesgos = !!(project.riesgos && project.riesgos.trim());
        const cPasos = !!(project.pasos && project.pasos.trim());
        const cIndic = !!(project.indicadores && project.indicadores.trim());

        const isTab4Complete = oppDoneCount === 5;

          const name = document.getElementById('new-proj-name').value.trim();

          const tech = document.getElementById('new-proj-tech').value;

          if (!name) {
            showToast('Por favor escribe un nombre para el proyecto.', 'error');
            return;

          const project = createEmptyProject(this.state.currentUser.id, name, context);
          project.tecnica = tech;

          data.projects.unshift(project);
          data.session.userId = this.state.currentUser.id;

          this.state.activeTechnique = tech;
          this.state.currentTab = 'problema';

          showToast(`¡Proyecto "${name}" creado exitosamente!`, 'success');
          App.render();

      App.duplicateProject = function (projectId) {
        const data = loadStorage();
        const orig = data.projects.find(p => p.id === projectId);
        if (!orig) return;
        const dup = JSON.parse(JSON.stringify(orig));
        dup.id = uuid();
        dup.nombre = orig.nombre + ' (Copia)';
        dup.creado = new Date().toISOString();
        dup.actualizado = new Date().toISOString();
        data.projects.unshift(dup);
        saveStorage(data);
        this.state.currentProjectId = dup.id;
        showToast('Proyecto duplicado.', 'success');
        this.render();
      };

      App.confirmDeleteProject = function (projectId) {
        this.showConfirmDialog(
          '¿Eliminar este proyecto?',
          'Esta acción borrará todas las causas, técnicas e ideas asociadas a este proyecto de tu navegador. No se puede deshacer.',
          'Eliminar Definitivamente',
          () => {
            const data = loadStorage();
            data.projects = data.projects.filter(p => p.id !== projectId);
            saveStorage(data);
            if (this.state.currentProjectId === projectId) {
              const remaining = data.projects.filter(p => p.userId === this.state.currentUser.id);
              this.state.currentProjectId = remaining.length > 0 ? remaining[0].id : null;
            }
            showToast('Proyecto eliminado.', 'info');
            this.render();

        );

      // Exportación de PDF Real usando html2pdf.js con validación pedagógica y aislamiento de tema
      App.exportPdfDirect = function (forceBypass = false) {
        const project = App.getCurrentProject();
        if (!project) return;

        const status = App.getProjectCompletionStatus(project);
        if (!forceBypass && (!status.isComplete || project.estado !== 'finalizado')) {
          App.showIncompleteExportModal(status.allMissing, () => {
            App.exportPdfDirect(true);
          });
          return;
        }

        const element = document.getElementById('print-area');
        if (!element) {
          showToast('No se encontró la ficha para exportar.', 'error');
          return;
        }

        showToast('Compilando documento PDF para entrega...', 'info', 2500);

        if (window.html2pdf) {
          try {
            // Clona el elemento y remueve clases oscuras para garantizar renderizado profesional sin fallas
            const clone = element.cloneNode(true);
            clone.style.width = '820px';
            clone.style.padding = '24px';
            clone.style.backgroundColor = '#ffffff';
            clone.style.color = '#0f172a';
            clone.classList.remove('dark');
            clone.querySelectorAll('*').forEach(el => {
              el.classList.remove('dark', 'dark:bg-navy-900', 'dark:bg-navy-950', 'dark:text-white', 'dark:text-slate-100', 'dark:text-slate-200', 'dark:border-navy-800', 'dark:border-navy-700');
            });

            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.left = '0';
            wrapper.style.top = '0';
            wrapper.style.width = '820px';
            wrapper.style.zIndex = '-9999';
            wrapper.style.opacity = '1';
            wrapper.style.pointerEvents = 'none';
            wrapper.style.backgroundColor = '#ffffff';
            wrapper.appendChild(clone);
            document.body.appendChild(wrapper);

            const safeName = (project.nombre || 'proyecto_innovacion')
              .toLowerCase()
              .replace(/[^a-z0-9_-]/g, '_')
              .substring(0, 35);

            const opt = {
              margin: [10, 10, 10, 10],
              filename: `Ficha_Innovacion_${safeName}.pdf`,
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0, scrollX: 0, windowWidth: 1024 },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            window.html2pdf().set(opt).from(clone).save()
              .then(() => {
                if (wrapper.parentNode) wrapper.remove();
                showToast('¡PDF compilado y descargado exitosamente!', 'success', 4000);
              })
              .catch(err => {
                console.error('Error al generar PDF con html2pdf:', err);
                if (wrapper.parentNode) wrapper.remove();
                showToast('Abriendo ventana de impresión para guardar como PDF...', 'warning', 3000);
                window.print();
              });
          } catch (e) {
            console.error('Excepción en exportPdfDirect:', e);
            window.print();
          }
        } else {
          window.print();
        }
      };

      // Enlace de Eventos del Módulo de Autenticación
      App.attachAuthEvents = function () {
        const tabLogin = document.getElementById('tab-auth-login');
        const tabRegister = document.getElementById('tab-auth-register');
        const btnTogglePwd = document.getElementById('btn-toggle-password-view');
        const pwdInput = document.getElementById('auth-password');
        const formAuth = document.getElementById('form-auth');
        const btnGuest = document.getElementById('btn-guest-login');

        if (tabLogin) tabLogin.onclick = () => { App.state.authMode = 'login'; App.render(); };
        if (tabRegister) tabRegister.onclick = () => { App.state.authMode = 'register'; App.render(); };

        if (btnTogglePwd && pwdInput) {
          btnTogglePwd.onclick = () => {
            const isPwd = pwdInput.type === 'password';
            pwdInput.type = isPwd ? 'text' : 'password';
            btnTogglePwd.textContent = isPwd ? 'Ocultar' : 'Mostrar';
          };
        }

        if (pwdInput && App.state.authMode === 'register') {
          pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            const evalResult = evaluatePasswordStrength(val);

            const reqIcon = document.getElementById('pwd-req-icon');
            const reqText = document.getElementById('pwd-req-text');
            const strLabel = document.getElementById('pwd-strength-label');
            const strBar = document.getElementById('pwd-strength-bar');

            if (reqIcon && reqText) {
              if (evalResult.meetsRequirement) {
                reqIcon.textContent = '✓';
                reqIcon.className = 'text-emerald-500 font-bold';
                reqText.className = 'text-emerald-600 dark:text-emerald-400 font-medium';
              } else {
                reqIcon.textContent = '○';
                reqIcon.className = 'text-slate-400 font-bold';
                reqText.className = 'text-slate-400';
              }
            }

            if (strLabel && strBar) {
              strLabel.textContent = evalResult.level;
              strLabel.className = 'font-bold ' + evalResult.textClass;
              strBar.style.width = evalResult.percent + '%';
              strBar.className = 'h-full transition-all duration-300 ' + evalResult.colorClass;
            }
          });
        }

        if (formAuth) {
          formAuth.onsubmit = async () => {
            const errorMsg = document.getElementById('auth-error-msg');
            errorMsg.classList.add('hidden');
            errorMsg.textContent = '';

            const correo = document.getElementById('auth-correo').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;

            if (!correo || !password) {
              errorMsg.textContent = 'Por favor completa todos los campos requeridos.';
              errorMsg.classList.remove('hidden');
              return;
            }

            const data = loadStorage();

            if (App.state.authMode === 'register') {
              const nombre = document.getElementById('auth-nombre').value.trim();
              const curso = (document.getElementById('auth-curso') || {}).value || '';

              if (password.length < 8) {
                errorMsg.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                errorMsg.classList.remove('hidden');
                return;
              }

              const exists = data.users.some(u => u.correo === correo);
              if (exists) {
                errorMsg.textContent = 'Ya existe una cuenta con este correo en este navegador.';
                errorMsg.classList.remove('hidden');
                return;
              }

              const salt = generateSalt(16);
              const hash = await hashPassword(password, salt);

              const newUser = {
                id: uuid(),
                nombre: nombre || 'Estudiante',
                correo,
                hash,
                sal: salt,
                curso: curso.trim(),
                invitado: false,
                creado: new Date().toISOString()
              };

              data.users.push(newUser);
              data.session.userId = newUser.id;
              saveStorage(data);
              App.state.currentUser = newUser;
              showToast('¡Cuenta local creada!', 'success');
              App.render();

            } else {
              const user = data.users.find(u => u.correo === correo);
              if (!user) {
                errorMsg.textContent = 'No se encontró ninguna cuenta local con este correo.';
                errorMsg.classList.remove('hidden');
                return;
              }

              const calculatedHash = await hashPassword(password, user.sal);
              if (calculatedHash !== user.hash) {
                errorMsg.textContent = 'Contraseña incorrecta.';
                errorMsg.classList.remove('hidden');
                return;
              }

              data.session.userId = user.id;
              saveStorage(data);
              App.state.currentUser = user;
              showToast(`¡Bienvenido de nuevo, ${user.nombre}!`, 'success');
              App.render();
            }
          };
        }

        if (btnGuest) {
          btnGuest.onclick = () => {
            const data = loadStorage();
            const guestUser = {
              id: uuid(),
              nombre: 'Invitado_' + Math.floor(Math.random() * 900 + 100),
              correo: 'invitado@local.browser',
              hash: '',
              sal: '',
              curso: 'Prueba Rápida',
              invitado: true,
              creado: new Date().toISOString()
            };
            data.users.push(guestUser);
            data.session.userId = guestUser.id;
            saveStorage(data);
            App.state.currentUser = guestUser;
            showToast('Has ingresado como Invitado.', 'info');
            App.render();
          };
        }
      };

      App.attachTabTecnicaEvents = function (project) {
        const techId = project.tecnica || 'scamper';
        const tech = TECHNIQUES_CONFIG[techId] || TECHNIQUES_CONFIG.scamper;
        const steps = tech.steps;
        const activeIdx = Math.max(0, Math.min(steps.length - 1, Number.isFinite(App.state.activeStepIndex) ? App.state.activeStepIndex : 0));
        App.state.activeStepIndex = activeIdx;
        const currentStep = steps[activeIdx];

        document.querySelectorAll('.btn-change-technique').forEach(btn => {
          btn.onclick = () => {
            const newTechId = btn.getAttribute('data-tech');
            App.state.activeStepIndex = 0;
            App.updateCurrentProject(p => {
              p.tecnica = newTechId;
              p.rt = p.rt || {};
              p.rt[newTechId] = p.rt[newTechId] || {};
            }, false);
            App.state.activeTechnique = newTechId;
            App.render();
          };
        });

        document.querySelectorAll('.btn-step-select').forEach(btn => {
          btn.onclick = () => {
            const sIdx = parseInt(btn.getAttribute('data-step-idx'), 10);
            App.state.activeStepIndex = Math.max(0, Math.min(steps.length - 1, isNaN(sIdx) ? 0 : sIdx));
            App.render();
          };
        });

        document.querySelectorAll('.btn-step-nav').forEach(btn => {
          btn.onclick = () => {
            const dir = parseInt(btn.getAttribute('data-dir'), 10) || 0;
            const cur = Number.isFinite(App.state.activeStepIndex) ? App.state.activeStepIndex : 0;
            App.state.activeStepIndex = Math.max(0, Math.min(steps.length - 1, cur + dir));
            App.render();
          };
        });

        const textarea = document.getElementById('step-answer-textarea');
        const counter = document.getElementById('step-word-counter');

        const handleBatchConvert = () => {
          const liveVal = (textarea ? textarea.value : (project.rt && project.rt[techId] && project.rt[techId][currentStep.id])) || '';
          const lines = liveVal.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length === 0) {
            showToast('Escribe ideas en el cuadro de texto (una por línea).', 'warning');
            return;
          }

          App.updateCurrentProject(p => {
            p.rt = p.rt || {};
            p.rt[techId] = p.rt[techId] || {};
            p.rt[techId][currentStep.id] = liveVal;
            p.ideas = p.ideas || [];
            lines.forEach((line, idx) => {
              p.ideas.push({
                id: uuid(),
                titulo: line.length > 60 ? line.substring(0, 57) + '...' : line,
                desc: line,
                tipo: 'Mixta',
                grupo: 'Sprint Brainstorming',
                origen: `Brainstorming Línea ${idx + 1}`,
                p: { impacto: 3, factibilidad: 3, madurez: 3, costo: 3, capacidades: 3 }
              });
            });
          }, false);

          showToast(`¡${lines.length} ideas transferidas al Banco con éxito!`, 'success');
          App.switchTab('ideas');
        };

        if (textarea && currentStep) {
          textarea.addEventListener('input', () => {
            const val = textarea.value;

            if (counter) {
              const words = val.trim().split(/\s+/).filter(Boolean).length;
              counter.textContent = `${words} palabras`;
            }

            if (techId === 'brainstorming' && currentStep.id === 'sprint') {
              const linesCount = val.split('\n').filter(l => l.trim().length > 0).length;
              const liveNotice = document.getElementById('sprint-live-status');
              if (liveNotice) {
                if (linesCount < 8) {
                  liveNotice.className = 'p-2.5 bg-amber-50 dark:bg-amber-950/30 border-l-4 border-amber-500 text-amber-800 dark:text-amber-200 text-xs rounded-r flex items-center justify-between';
                  liveNotice.innerHTML = `<span>⚠️ Has generado <strong>${linesCount} de mínimo 8 ideas</strong> (una por línea). ¡Sigue escribiendo sin censurar!</span>`;
                } else {
                  liveNotice.className = 'p-2.5 bg-emerald-50 dark:bg-emerald-950/30 border-l-4 border-emerald-500 text-emerald-800 dark:text-emerald-200 text-xs rounded-r flex items-center justify-between';
                  liveNotice.innerHTML = `<span>✓ ¡Excelente! Has alcanzado <strong>${linesCount} ideas</strong> en el sprint.</span>
                    <button type="button" id="btn-batch-convert-brainstorming" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-2.5 py-1 rounded shadow">
                      Enviar todas al Banco
                    </button>`;
                  const newBatchBtn = document.getElementById('btn-batch-convert-brainstorming');
                  if (newBatchBtn) newBatchBtn.onclick = handleBatchConvert;
                }
              }
            }

            App.debouncedStepSave(techId, currentStep.id, val);
          });

        const initialBatchBtn = document.getElementById('btn-batch-convert-brainstorming');
        if (initialBatchBtn) initialBatchBtn.onclick = handleBatchConvert;

        const btnConvertIdea = document.getElementById('btn-convert-step-to-idea');

          btnConvertIdea.onclick = () => {
            const liveText = (textarea ? textarea.value : (project.rt && project.rt[techId] && project.rt[techId][currentStep.id])) || '';
            if (!liveText || !liveText.trim()) {
              showToast('Escribe una respuesta en este paso antes de convertirla en idea.', 'warning');
              return;
            }

            App.updateCurrentProject(p => {
              p.rt = p.rt || {};
              p.rt[techId] = p.rt[techId] || {};
              p.rt[techId][currentStep.id] = liveText.trim();
            }, false);

            const firstLine = liveText.trim().split('\n')[0].replace(/^[-*•\d.)\s]+/, '').trim();
            const cleanTitle = firstLine.length > 55 ? firstLine.substring(0, 52) + '...' : firstLine;
            const suggestedType = currentStep.defaultType || (techId === 'six_hats' ? (currentStep.id === 'black' ? 'Organizacional' : (currentStep.id === 'white' || currentStep.id === 'green' ? 'Tecnológica' : 'Mixta')) : 'Mixta');

            App.openIdeaModal(null, {
              titulo: cleanTitle || `${currentStep.title}`,
              desc: liveText.trim(),
              tipo: suggestedType,
              grupo: tech.name,
              origen: `${tech.name} - ${currentStep.title}`
            });
          };
        }

        // Temporizador de 4 minutos
        const btnTimerToggle = document.getElementById('btn-timer-toggle');
        const btnTimerReset = document.getElementById('btn-timer-reset');
        const timerDisplay = document.getElementById('timer-display');

        if (btnTimerToggle && timerDisplay) {
          btnTimerToggle.onclick = () => {
            if (App.state.brainstormingRunning) {
              clearInterval(App.state.brainstormingInterval);
              App.state.brainstormingRunning = false;
              btnTimerToggle.textContent = 'Iniciar';
            } else {
              App.state.brainstormingRunning = true;
              btnTimerToggle.textContent = 'Pausar';
              App.state.brainstormingInterval = setInterval(() => {
                const currentProj = App.getCurrentProject();
                if (!currentProj) return;
                let t = currentProj.brainstormingTimer || 240;
                if (t > 0) {
                  t -= 1;
                  currentProj.brainstormingTimer = t;
                  timerDisplay.textContent = `${Math.floor(t / 60)}:${(t % 60).toString().padStart(2, '0')}`;
                  if (t === 0) {
                    clearInterval(App.state.brainstormingInterval);
                    App.state.brainstormingRunning = false;
                    btnTimerToggle.textContent = 'Iniciar';
                    showToast('⏰ ¡Tiempo cumplido de los 4 minutos!', 'warning', 5000);
                  }
                }
              }, 1000);
            }
          };
        }

        if (btnTimerReset && timerDisplay) {
          btnTimerReset.onclick = () => {
            clearInterval(App.state.brainstormingInterval);
            App.state.brainstormingRunning = false;
            App.updateCurrentProject(p => { p.brainstormingTimer = 240; }, false);
            timerDisplay.textContent = '4:00';
            if (btnTimerToggle) btnTimerToggle.textContent = 'Iniciar';
          };
        }

      App.refreshSingleIdeaScore = function (ideaId) {
        const project = App.getCurrentProject();
        if (!project) return;
        const idea = (project.ideas || []).find(i => i.id === ideaId);
        if (!idea) return;
        const score = App.calculateIdeaScore(idea, project.pesos || {});
        const display = document.getElementById(`score-display-${ideaId}`);
        if (display) display.textContent = score;
      };

      App.refreshMatrixScores = function () {
        const project = App.getCurrentProject();
        if (!project || !project.ideas) return;
        project.ideas.forEach(idea => {
          App.refreshSingleIdeaScore(idea.id);
        });
      };

      App.attachTabOportunidadEvents = function (project) {
        const selectOportunidad = document.getElementById('select-oportunidad');
        if (selectOportunidad) {
          selectOportunidad.onchange = () => {
            const val = selectOportunidad.value;
            App.updateCurrentProject(p => {
              p.oportunidadId = val;
            }, true);
          };
        }

        const handleFinalizeProject = () => {
          const currentProj = App.getCurrentProject();
          const status = App.getProjectCompletionStatus(currentProj);
          if (!status.isComplete) {
            App.showIncompleteFinalizeModal(status.allMissing);
            return;
          }
          App.updateCurrentProject(p => {
            p.estado = 'finalizado';
            p.finalizadoFecha = new Date().toISOString();
          }, true);
          showToast('🎉 ¡Felicitaciones! Has formalizado y finalizado este proyecto de innovación.', 'success', 5000);
        };

        const btnTab4Finalize = document.getElementById('tab4-btn-finalize-project');
        if (btnTab4Finalize) btnTab4Finalize.onclick = handleFinalizeProject;

        document.querySelectorAll('.btn-direct-finalize').forEach(btn => {
          btn.onclick = handleFinalizeProject;
        });

        const btnTab4Reopen = document.getElementById('tab4-btn-reopen-project');
        if (btnTab4Reopen) {
          btnTab4Reopen.onclick = () => {
            App.updateCurrentProject(p => {
              p.estado = 'en_progreso';
            }, true);
            showToast('Proyecto reabierto para edición.', 'info');
          };
        }

        const debouncedSave = debounce(() => {
          const selVal = (document.getElementById('select-oportunidad') || {}).value;
          const justVal = (document.getElementById('input-justificacion-oportunidad') || {}).value || '';
          const riesgosVal = (document.getElementById('input-riesgos') || {}).value || '';
          const pasosVal = (document.getElementById('input-pasos') || {}).value || '';
          const indicVal = (document.getElementById('input-indicadores') || {}).value || '';

          App.updateCurrentProject(p => {
            if (selVal) p.oportunidadId = selVal;
            p.justificacionOportunidad = justVal;
            p.riesgos = riesgosVal;
            p.pasos = pasosVal;
            p.indicadores = indicVal;
          }, false);

          App.refreshTab4AuditUI();
        }, 300);

        ['input-justificacion-oportunidad', 'input-riesgos', 'input-pasos', 'input-indicadores'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('input', debouncedSave);
        });

        App.bindTab4FocusButtons();
      };

      App.bindTab4FocusButtons = function () {
        document.querySelectorAll('.btn-focus-tab4').forEach(btn => {
          btn.onclick = () => {
            const fieldId = btn.getAttribute('data-field');
            const targetEl = document.getElementById(fieldId);
            if (targetEl) {
              targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              setTimeout(() => {
                targetEl.focus();
                targetEl.classList.add('ring-4', 'ring-amber-500/60');
                setTimeout(() => targetEl.classList.remove('ring-4', 'ring-amber-500/60'), 1600);
              }, 250);
            }
          };
        });

        document.querySelectorAll('.btn-jump-to-missing').forEach(btn => {
          btn.onclick = () => {
            const targetTab = btn.getAttribute('data-tab');
            if (targetTab) App.switchTab(targetTab);
          };
        });
      };

      App.refreshTab4AuditUI = function () {
        const project = App.getCurrentProject();
        if (!project) return;

        const ideas = project.ideas || [];
        const selectedId = project.oportunidadId;
        const selectedIdea = ideas.find(i => i.id === selectedId);

        const cIdea = !!(selectedId && selectedIdea);
        const cJust = !!(project.justificacionOportunidad && project.justificacionOportunidad.trim());
        const cRiesgos = !!(project.riesgos && project.riesgos.trim());
        const cPasos = !!(project.pasos && project.pasos.trim());
        const cIndic = !!(project.indicadores && project.indicadores.trim());
        const oppDoneCount = [cIdea, cJust, cRiesgos, cPasos, cIndic].filter(Boolean).length;
        const isTab4Complete = oppDoneCount === 5;

        // Actualizar badges individuales sobre los campos
        const updateBadge = (id, complete) => {
          const badge = document.getElementById(id);
          if (!badge) return;
          badge.className = `text-[11px] px-2 py-0.5 rounded font-semibold ${
            complete
              ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
              : 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300'
          }`;
          badge.textContent = complete ? 'Completado ✓' : 'Pendiente';
        };

        updateBadge('badge-tab4-idea', cIdea);
        updateBadge('badge-tab4-just', cJust);
        updateBadge('badge-tab4-riesgos', cRiesgos);
        updateBadge('badge-tab4-pasos', cPasos);
        updateBadge('badge-tab4-indicadores', cIndic);

        // Actualizar estado del botón de finalización en cabecera
        const status = App.getProjectCompletionStatus(project);
        const btnHeaderFinalize = document.getElementById('tab4-btn-finalize-project');
        if (btnHeaderFinalize) {
          if (status.isComplete) {
            btnHeaderFinalize.className = 'text-xs font-bold px-4 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-md ring-2 ring-emerald-400/50 cursor-pointer transition flex items-center gap-1.5';
            btnHeaderFinalize.innerHTML = '<svg class="w-4 h-4 text-white shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span>¡Finalizar Proyecto! ✓</span>';
          } else {
            btnHeaderFinalize.className = 'text-xs font-bold px-4 py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-navy-950 shadow-md cursor-pointer transition flex items-center gap-1.5';
            btnHeaderFinalize.innerHTML = '<svg class="w-4 h-4 text-navy-950 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span>Finalizar Proyecto</span>';
          }
        }

        const banner = document.getElementById('tab4-audit-banner');
        if (!banner) return;

        const otherMissing = status.allMissing.filter(m => m.tab !== 'oportunidad');

        if (status.isComplete) {
          banner.innerHTML = `
            <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-300 dark:border-emerald-700/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center text-base shrink-0">✓</div>
                <div>
                  <h4 class="text-sm font-bold text-emerald-950 dark:text-emerald-200">
                    ¡Todos los 13 Requisitos Cumplidos (Paso 4: 5/5)!
                  </h4>
                  <p class="text-xs text-emerald-800 dark:text-emerald-300 mt-0.5">
                    El proyecto está 100% completo según la rúbrica de la Clase 6. Haz clic en <strong>Finalizar Proyecto</strong> para sellar tu entrega.
                  </p>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button type="button" class="btn-direct-finalize bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition cursor-pointer">
                  Sellar y Finalizar ✓
                </button>
                <button type="button" class="btn-navigate-tab bg-navy-900 hover:bg-navy-800 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition" data-target="ficha">
                  Ver Ficha →
                </button>
              </div>
            </div>
          `;
          banner.querySelectorAll('.btn-direct-finalize').forEach(btn => {
            btn.onclick = () => {
              App.updateCurrentProject(p => {
                p.estado = 'finalizado';
                p.finalizadoFecha = new Date().toISOString();
              }, true);
              showToast('🎉 ¡Felicitaciones! Has formalizado y finalizado este proyecto de innovación.', 'success', 5000);
            };
          });
          banner.querySelectorAll('.btn-navigate-tab').forEach(btn => {
            btn.onclick = () => App.switchTab(btn.getAttribute('data-target'));
          });
        } else {
          banner.innerHTML = `
            <div class="p-4 rounded-xl ${isTab4Complete ? 'bg-emerald-50/50 dark:bg-navy-900/60 border-emerald-300 dark:border-emerald-700/80' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-700/80'} border space-y-3 shadow-sm">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-base">${isTab4Complete ? '🎉' : '📋'}</span>
                  <h4 class="text-xs font-bold uppercase tracking-wider ${isTab4Complete ? 'text-emerald-900 dark:text-emerald-200' : 'text-amber-900 dark:text-amber-200'}">
                    ${isTab4Complete ? '¡Paso 4 Completado al 100% (5/5)! Revisa los pasos previos para sellar la entrega:' : `Checklist del Paso 4: Definición de la Oportunidad (${oppDoneCount} de 5 listos)`}
                  </h4>
                </div>
                <span class="text-xs font-mono font-bold px-2 py-0.5 rounded ${isTab4Complete ? 'bg-emerald-200 text-emerald-900' : 'bg-amber-200 text-amber-900'}">${oppDoneCount}/5</span>
              </div>

              <p class="text-xs ${isTab4Complete ? 'text-emerald-800 dark:text-emerald-300' : 'text-amber-800 dark:text-amber-300/90'} leading-relaxed">
                ${isTab4Complete ? 'Todos los campos de la oportunidad están listos. A continuación puedes revisar o ir a completar los pasos anteriores:' : 'Haz clic en cualquiera de los puntos con <span class="text-rose-600 font-bold">❌</span> para ir directamente al campo y completarlo:'}
              </p>

              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-xs">
                <button type="button" class="btn-focus-tab4 text-left p-2 rounded-lg bg-white dark:bg-navy-900 border ${cIdea ? 'border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'border-rose-300 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/30'} font-medium flex items-center justify-between transition" data-field="select-oportunidad">
                  <span><span>${cIdea ? '✓' : '❌'}</span> 1. Idea Ganadora</span>
                  <span class="text-[10px] opacity-75">${cIdea ? 'Elegida' : 'Elegir ↓'}</span>
                </button>
                <button type="button" class="btn-focus-tab4 text-left p-2 rounded-lg bg-white dark:bg-navy-900 border ${cJust ? 'border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'border-rose-300 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/30'} font-medium flex items-center justify-between transition" data-field="input-justificacion-oportunidad">
                  <span><span>${cJust ? '✓' : '❌'}</span> 2. Justificación</span>
                  <span class="text-[10px] opacity-75">${cJust ? 'Lista' : 'Redactar ↓'}</span>
                </button>
                <button type="button" class="btn-focus-tab4 text-left p-2 rounded-lg bg-white dark:bg-navy-900 border ${cRiesgos ? 'border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'border-rose-300 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/30'} font-medium flex items-center justify-between transition" data-field="input-riesgos">
                  <span><span>${cRiesgos ? '✓' : '❌'}</span> 3. Riesgos/Supuestos</span>
                  <span class="text-[10px] opacity-75">${cRiesgos ? 'Listos' : 'Escribir ↓'}</span>
                </button>
                <button type="button" class="btn-focus-tab4 text-left p-2 rounded-lg bg-white dark:bg-navy-900 border ${cPasos ? 'border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'border-rose-300 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/30'} font-medium flex items-center justify-between transition" data-field="input-pasos">
                  <span><span>${cPasos ? '✓' : '❌'}</span> 4. Piloto / Pasos</span>
                  <span class="text-[10px] opacity-75">${cPasos ? 'Definido' : 'Definir ↓'}</span>
                </button>
                <button type="button" class="btn-focus-tab4 text-left p-2 rounded-lg bg-white dark:bg-navy-900 border ${cIndic ? 'border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'border-rose-300 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/30'} font-medium flex items-center justify-between transition" data-field="input-indicadores">
                  <span><span>${cIndic ? '✓' : '❌'}</span> 5. Indicadores</span>
                  <span class="text-[10px] opacity-75">${cIndic ? 'Listos' : 'Definir ↓'}</span>
                </button>
              </div>

              ${otherMissing.length > 0 ? `
                <div class="pt-2 border-t border-amber-200 dark:border-navy-800">
                  <div class="text-[11px] font-bold text-amber-900 dark:text-amber-300 mb-1 flex items-center gap-1.5">
                    <span>⚠️</span> Faltan ${otherMissing.length} requisito(s) en otros pasos para poder formalizar la entrega oficial:
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${otherMissing.map(m => `
                      <button type="button" class="btn-jump-to-missing text-[11px] px-2.5 py-1 rounded bg-white dark:bg-navy-900 border border-amber-300 dark:border-navy-700 text-amber-900 dark:text-amber-300 hover:bg-amber-100 font-medium transition flex items-center gap-1 cursor-pointer" data-tab="${m.tab}">
                        <span class="text-rose-500 font-bold">○</span> ${esc(m.label)} →
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          `;
          App.bindTab4FocusButtons();
        }
      };

      App.attachTabFichaEvents = function (project) {
        // FINALIZAR / REABRIR PROYECTO
        const btnFinalize = document.getElementById('btn-finalize-project');
        if (btnFinalize) {
          btnFinalize.onclick = () => {
            const currentProj = App.getCurrentProject();
            const status = App.getProjectCompletionStatus(currentProj);
            if (!status.isComplete) {
              App.showIncompleteFinalizeModal(status.allMissing);
              return;
            }
            App.updateCurrentProject(p => {
              p.estado = 'finalizado';
              p.finalizadoFecha = new Date().toISOString();
            }, true);
            showToast('🎉 ¡Felicitaciones! Has formalizado y sellado este proyecto de innovación.', 'success', 5000);
          };
        }

        const btnReopen = document.getElementById('btn-reopen-project');
        if (btnReopen) {
          btnReopen.onclick = () => {
            App.updateCurrentProject(p => {
              p.estado = 'en_progreso';
            }, true);
            showToast('Proyecto reabierto para edición.', 'info');
          };
        }

        // DESCARGA DE PDF REAL CON html2pdf
        const btnDownloadPdf = document.getElementById('btn-download-pdf-real');
        if (btnDownloadPdf) {
          btnDownloadPdf.onclick = () => {
            App.exportPdfDirect();
          };
        }

        // Botón Imprimir con validación pedagógica
        const btnPrint = document.getElementById('btn-print-pdf');
        if (btnPrint) {
          btnPrint.onclick = () => {
            const currentProj = App.getCurrentProject();
            const status = App.getProjectCompletionStatus(currentProj);
            if (!status.isComplete || currentProj.estado !== 'finalizado') {
              App.showIncompleteExportModal(status.allMissing, () => {
                window.print();
              });
              return;
            }
            window.print();
          };
        }

        // Botones de navegación a hitos o requisitos pendientes
        document.querySelectorAll('.btn-jump-milestone, .btn-jump-to-missing').forEach(btn => {
          btn.onclick = () => {
            const targetTab = btn.getAttribute('data-tab');
            if (targetTab) {
              App.switchTab(targetTab);
            }
          };
        });

        // Generar Markdown
        const generateMarkdown = () => {
          const pesos = project.pesos || { impacto: 25, factibilidad: 20, madurez: 15, costo: 20, capacidades: 20 };
          const ideas = (project.ideas || []).map(i => ({ ...i, score: App.calculateIdeaScore(i, pesos) }))
            .sort((a, b) => b.score - a.score);
          const oportunidad = ideas.find(i => i.id === project.oportunidadId) || (ideas.length > 0 ? ideas[0] : null);
          const tech = TECHNIQUES_CONFIG[project.tecnica] || TECHNIQUES_CONFIG.scamper;
          const techAnswers = (project.rt && project.rt[project.tecnica]) ? project.rt[project.tecnica] : {};

          return `# FICHA DE OPORTUNIDAD DE INNOVACIÓN
**Gestión Tecnológica • Clase 6: Creatividad e Innovación**
**Proyecto:** ${project.nombre || 'Sin título'}
**Organización:** ${project.contexto || 'No especificado'}
**Estado:** ${project.estado === 'finalizado' ? 'Finalizado' : 'En Progreso'}
**Fecha de Actualización:** ${formatDate(project.actualizado)}

---

## 1. DIAGNÓSTICO DEL PROBLEMA
* **Síntoma Observado:** ${project.sintoma || 'Pendiente'}
* **Causa Más Crítica:** ${project.causaCritica || 'Pendiente'}
* **Justificación de la Causa:** ${project.justificacion || 'Pendiente'}
* **Problema Reformulado (Sin solución previa):** ${project.problema || 'Pendiente'}
* **Pregunta de Oportunidad:** ${project.pregunta || 'Pendiente'}
* **Evidencia / Indicador:** ${project.evidencia || 'Pendiente'}

---

## 2. TÉCNICA CREATIVA GUIADA (${tech.name})
${tech.steps.map(s => `* **${s.title}:** ${techAnswers[s.id] || 'Sin respuesta'}`).join('\n')}

---

## 3. MATRIZ DE PRIORIZACIÓN DE ALTERNATIVAS
| Ranking | Idea de Innovación | Tipo | Impacto | Factibilidad | Madurez | Costo | Capacidades | Puntaje |
|:---:|:---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|
${ideas.map((i, idx) => `| #${idx + 1} | ${i.titulo} | ${i.tipo} | ${i.p ? i.p.impacto : '-'} | ${i.p ? i.p.factibilidad : '-'} | ${i.p ? i.p.madurez : '-'} | ${i.p ? i.p.costo : '-'} | ${i.p ? i.p.capacidades : '-'} | **${i.score}** |`).join('\n')}

---

## 4. OPORTUNIDAD SELECCIONADA Y PLAN DE ACCIÓN
* **Oportunidad Ganadora:** ${oportunidad ? oportunidad.titulo : 'Pendiente'} (${oportunidad ? oportunidad.tipo : ''})
* **Descripción:** ${oportunidad ? oportunidad.desc : ''}
* **Justificación Estratégica:** ${project.justificacionOportunidad || 'Pendiente'}
* **Riesgos y Supuestos Críticos:** ${project.riesgos || 'Pendiente'}
* **Primeros Pasos / Experimento Piloto:** ${project.pasos || 'Pendiente'}
* **Indicadores de Éxito:** ${project.indicadores || 'Pendiente'}

---
*Generado mediante Innovation Canvas.*
`;
        };

        const btnCopyMd = document.getElementById('btn-copy-markdown');
        if (btnCopyMd) {
          btnCopyMd.onclick = async () => {
            const md = generateMarkdown();
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(md);
              } else {
                const ta = document.createElement('textarea');
                ta.value = md;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
              }
              showToast('¡Markdown copiado al portapapeles!', 'success');
            } catch (err) {
              showToast('No se pudo copiar automáticamente.', 'warning');
            }
          };
        }

        const btnDownloadMd = document.getElementById('btn-download-markdown');
        if (btnDownloadMd) {
          btnDownloadMd.onclick = () => {
            const md = generateMarkdown();
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ficha_oportunidad_${(project.nombre || 'proyecto').replace(/[^a-zA-Z0-9_-]/g, '_')}.md`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Archivo Markdown descargado.', 'success');
          };
        }

        const btnDownloadJson = document.getElementById('btn-download-json');
        if (btnDownloadJson) {
          btnDownloadJson.onclick = () => {
            const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `proyecto_${(project.nombre || 'innovacion').replace(/[^a-zA-Z0-9_-]/g, '_')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Archivo JSON descargado.', 'success');
          };
        }
      };

      /* ==========================================================================
         SECCIÓN 10: INICIALIZACIÓN
         ========================================================================== */
      window.App = App;
      document.addEventListener('DOMContentLoaded', () => {
        App.init();
      });

    })();
  </script>
</body>
</html>
